<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Z-Board Demo</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .demo-nav {
        position: fixed;
        top: 16px;
        left: 50%;
        z-index: 10000;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        padding: 5px;
        border-radius: 10px;
        background: rgba(15, 23, 42, .78);
        box-shadow: 0 8px 24px rgba(15, 23, 42, .2);
      }
      .demo-nav button {
        border: 0;
        border-radius: 7px;
        padding: 8px 14px;
        color: #cbd5e1;
        background: transparent;
        font-size: 13px;
        cursor: pointer;
      }
      .demo-nav button.active,
      .demo-nav button:hover {
        color: #fff;
        background: rgba(148, 163, 184, .24);
      }
      #app {
        position: fixed;
        inset: 0;
      }
    </style>
  </head>
  <body>
    <nav class="demo-nav" aria-label="Z-Board demo">
      <button id="show-whiteboard" class="active" type="button">白板</button>
      <button id="show-screenshot" type="button">截图</button>
    </nav>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
